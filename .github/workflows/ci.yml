name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ProTranslate.CI.slnx

      - name: Build
        run: dotnet build ProTranslate.CI.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test core
        run: dotnet test tests/ProTranslate.Tests/ProTranslate.Tests.csproj -c Release --no-build --logger "trx;LogFileName=protranslate-tests.trx" --results-directory artifacts/test-results

      - name: Test analyzers
        run: dotnet test tests/ProTranslate.Analyzers.Tests/ProTranslate.Analyzers.Tests.csproj -c Release --no-build --logger "trx;LogFileName=protranslate-analyzers-tests.trx" --results-directory artifacts/test-results

      - name: Test Avalonia adapter
        run: dotnet test tests/ProTranslate.Avalonia.Tests/ProTranslate.Avalonia.Tests.csproj -c Release --no-build --logger "trx;LogFileName=protranslate-avalonia-tests.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build docs
        run: ./build-docs.sh

  sample-builds:
    name: Sample Builds
    runs-on: ${{ matrix.os }}
    needs: [build-test, docs-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Avalonia and MAUI samples
            os: macos-26
            script: |
              XCODE_ROOT="/Applications/Xcode.app"
              if [ ! -d "$XCODE_ROOT" ]; then
                XCODE_ROOT="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d | sort | tail -n 1)"
              fi
              if [ -z "$XCODE_ROOT" ] || [ ! -d "$XCODE_ROOT" ]; then
                echo "::error::No Xcode installation was found on the macOS runner."
                exit 1
              fi
              export MD_APPLE_SDK_ROOT="$XCODE_ROOT"
              export DEVELOPER_DIR="$XCODE_ROOT/Contents/Developer"
              echo "MD_APPLE_SDK_ROOT=$MD_APPLE_SDK_ROOT" >> "$GITHUB_ENV"
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              sudo xcode-select -s "$DEVELOPER_DIR"
              xcodebuild -version
              dotnet workload install maui
              dotnet build samples/ProTranslate.Avalonia.Sample/ProTranslate.Avalonia.Sample.csproj -c Release -p:ContinuousIntegrationBuild=true
              dotnet build samples/ProTranslate.Maui.Sample/ProTranslate.Maui.Sample.csproj -c Release -p:ContinuousIntegrationBuild=true
          - name: Windows WPF, WinUI, and Uno samples
            os: windows-latest
            script: |
              dotnet build samples/ProTranslate.Wpf.Sample/ProTranslate.Wpf.Sample.csproj -c Release -p:ContinuousIntegrationBuild=true
              dotnet build samples/ProTranslate.WinUI.Sample/ProTranslate.WinUI.Sample.csproj -c Release -p:ContinuousIntegrationBuild=true
              dotnet build samples/ProTranslate.Uno.Sample/ProTranslate.Uno.Sample.csproj -c Release -p:ContinuousIntegrationBuild=true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build ${{ matrix.name }}
        shell: bash
        run: ${{ matrix.script }}

  pack-preview:
    name: Pack Preview
    runs-on: macos-latest
    needs: [build-test, sample-builds]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Pack
        run: ./pack.sh 0.1.0-ci.${{ github.run_number }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-preview-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 7
